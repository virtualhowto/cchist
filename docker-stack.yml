version: "3.9"

services:
  cchist:
    image: cchist:latest
    networks:
      - t3_proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=t3_proxy
        - traefik.http.routers.cchist.rule=Host(`cchist.virtualhowto.com`)
        - traefik.http.routers.cchist.entrypoints=websecure
        - traefik.http.routers.cchist.tls=true
        - traefik.http.routers.cchist.middlewares=cchist-auth@docker
        - traefik.http.services.cchist.loadbalancer.server.port=80

        # Authentik forward-auth middleware.
        # Assumes an Authentik outpost is reachable on the t3_proxy overlay network
        # at authentik-proxy-outpost:9000. Change the service name if yours differs.
        - traefik.http.middlewares.cchist-auth.forwardauth.address=http://authentik-proxy-outpost:9000/outpost.goauthentik.io/auth/traefik
        - traefik.http.middlewares.cchist-auth.forwardauth.trustForwardHeader=true
        - traefik.http.middlewares.cchist-auth.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version

networks:
  t3_proxy:
    external: true
