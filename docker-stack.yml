services:
  cchist:
    image: ${IMAGE}
    networks:
      - t3_swarm
    volumes:
      - type: bind
        source: /srv/cchist/lidar/web
        target: /usr/share/nginx/html/lidar
        read_only: true
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==NUC8i7HNK
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: stop-first
      resources:
        limits:
          memory: 192M
      labels:
        - traefik.enable=true
        - traefik.constraint=proxy-public
        - traefik.swarm.network=t3_swarm
        - traefik.http.routers.cchist-swarm.rule=Host(`cchist.virtualhowto.com`)
        - traefik.http.routers.cchist-swarm.entrypoints=websecure
        - traefik.http.routers.cchist-swarm.tls=true
        - traefik.http.routers.cchist-swarm.tls.certresolver=dns-cloudflare
        - traefik.http.routers.cchist-swarm.middlewares=chain-authentik@file
        - traefik.http.services.cchist-swarm.loadbalancer.server.port=80

networks:
  t3_swarm:
    external: true
