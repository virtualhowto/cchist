name: Sync Central Coast LiDAR

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: Optional URL to a TYPE|URL|SHA256 manifest. Leave blank to use the repository manifest.
        required: false
        type: string
      process:
        description: Generate web hillshade, slope and terrain-ruggedness tiles after download
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - data/lidar-downloads.txt
      - scripts/lidar-sync.sh
      - scripts/select-lidar-epochs.py
      - scripts/build-lidar-epochs.sh
      - scripts/nsw-historic-imagery-discover.py
      - scripts/elvis-discover.py
      - scripts/elvis-frontend-probe.sh
      - scripts/elvis-backend-probe.sh
      - .github/workflows/lidar-sync.yml

concurrency:
  group: cchist-lidar
  cancel-in-progress: true

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      LIDAR_ROOT: /mnt/usb/stack/cchist/lidar
      PERMISSIONS_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Permissions-only') }}
      CATALOGUE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Imagery-only') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner host and storage
        run: |
          set -euo pipefail
          test "$(hostname)" = "NUC8i7HNK"
          docker info >/dev/null
          echo '=== Filesystems ==='
          df -hT / /mnt/usb 2>&1 || true
          echo '=== /mnt/usb mount ==='
          findmnt -T /mnt/usb
          mkdir -p "$LIDAR_ROOT/web"

      - name: Resolve manifest
        if: env.PERMISSIONS_ONLY != 'true' && env.CATALOGUE_ONLY != 'true'
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          url='${{ inputs.manifest_url }}'
          if [ -n "$url" ]; then
            curl --fail --location --retry 5 "$url" -o "$RUNNER_TEMP/lidar-downloads.txt"
            echo "path=$RUNNER_TEMP/lidar-downloads.txt" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Ev '^[[:space:]]*(#|$)' data/lidar-downloads.txt | grep -qE '^(dem|laz)\|https?://'; then
            echo "Using curated repository manifest"
            echo "path=data/lidar-downloads.txt" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No curated download URLs found. Probing current ELVIS services before fallback discovery."
          chmod +x scripts/elvis-frontend-probe.sh scripts/elvis-backend-probe.sh scripts/elvis-discover.py
          scripts/elvis-frontend-probe.sh || true
          scripts/elvis-backend-probe.sh || true
          scripts/elvis-discover.py \
            --bbox 150.95 -33.62 151.65 -33.10 \
            --manifest "$RUNNER_TEMP/lidar-downloads.txt" \
            --json "$RUNNER_TEMP/elvis-central-coast.json"
          echo "path=$RUNNER_TEMP/lidar-downloads.txt" >> "$GITHUB_OUTPUT"

      - name: Preview manifest
        if: env.PERMISSIONS_ONLY != 'true' && env.CATALOGUE_ONLY != 'true'
        run: |
          set -euo pipefail
          manifest='${{ steps.manifest.outputs.path }}'
          echo "Manifest entries: $(grep -Ev '^[[:space:]]*(#|$)' "$manifest" | wc -l)"
          sed -n '1,30p' "$manifest"

      - name: Download and build latest LiDAR layers
        if: env.PERMISSIONS_ONLY != 'true' && env.CATALOGUE_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/lidar-sync.sh
          process='${{ inputs.process }}'
          if [ -z "$process" ]; then process=true; fi
          bash scripts/lidar-sync.sh '${{ steps.manifest.outputs.path }}' "$process"

      - name: Build dated LiDAR hillshade epochs
        if: env.PERMISSIONS_ONLY != 'true' && env.CATALOGUE_ONLY != 'true' && success() && (inputs.process == true || inputs.process == '')
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-lidar-epochs.sh scripts/select-lidar-epochs.py
          bash scripts/build-lidar-epochs.sh

      - name: Refresh NSW historic imagery catalogue
        if: env.PERMISSIONS_ONLY != 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/nsw-historic-imagery-discover.py
          python3 scripts/nsw-historic-imagery-discover.py --out "$LIDAR_ROOT/web/imagery.json" || {
            echo 'Historic imagery catalogue refresh failed; retaining any previous catalogue.'
            exit 0
          }
          cat "$LIDAR_ROOT/web/imagery.json" | head -120

      - name: Publish web permissions
        if: always()
        run: |
          set -euo pipefail
          root="$LIDAR_ROOT/web"
          docker run --rm -v "$root:/data" nginx:1.27-alpine sh -lc '
            chmod 755 /data
            [ ! -e /data/status.json ] || chmod 644 /data/status.json
            [ ! -e /data/imagery.json ] || chmod 644 /data/imagery.json
          '
          for f in status.json imagery.json; do
            test ! -e "$root/$f" || stat -c "$f: %a %U:%G %s bytes" "$root/$f"
          done

      - name: Show storage summary
        if: always() && env.PERMISSIONS_ONLY != 'true' && env.CATALOGUE_ONLY != 'true'
        run: |
          echo "### LiDAR storage" >> "$GITHUB_STEP_SUMMARY"
          du -sh "$LIDAR_ROOT/raw" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          du -sh "$LIDAR_ROOT/derived" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          du -sh "$LIDAR_ROOT/web" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          df -h "$LIDAR_ROOT" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          test -f "$LIDAR_ROOT/web/status.json" && cat "$LIDAR_ROOT/web/status.json" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Force cchist service refresh
        if: success()
        run: |
          if docker service inspect cchist_cchist >/dev/null 2>&1; then
            docker service update --force cchist_cchist >/dev/null
          fi
