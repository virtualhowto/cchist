name: Sync Local High-Resolution LiDAR Cache

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: Optional URL to a TYPE|URL|SHA256 manifest. Leave blank to use the repository manifest/discovery.
        required: false
        type: string
      west:
        description: Local cache AOI west longitude
        required: true
        default: '150.95'
        type: string
      south:
        description: Local cache AOI south latitude
        required: true
        default: '-33.62'
        type: string
      east:
        description: Local cache AOI east longitude
        required: true
        default: '151.65'
        type: string
      north:
        description: Local cache AOI north latitude
        required: true
        default: '-33.10'
        type: string
      process:
        description: Generate local hillshade, slope and dated terrain products after download
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - data/lidar-downloads.txt
      - scripts/lidar-sync.sh
      - scripts/select-lidar-epochs.py
      - scripts/build-lidar-epochs.sh
      - scripts/elvis-discover.py
      - scripts/elvis-frontend-probe.sh
      - scripts/elvis-backend-probe.sh
      - .github/workflows/lidar-sync.yml

concurrency:
  group: cchist-lidar-local-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      LIDAR_ROOT: /mnt/usb/stack/cchist/lidar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner host and storage
        run: |
          set -euo pipefail
          test "$(hostname)" = "NUC8i7HNK"
          docker info >/dev/null
          df -hT / /mnt/usb 2>&1 || true
          findmnt -T /mnt/usb
          mkdir -p "$LIDAR_ROOT/web"

      - name: Resolve and validate local AOI
        shell: bash
        run: |
          set -euo pipefail
          west='${{ inputs.west }}'; south='${{ inputs.south }}'; east='${{ inputs.east }}'; north='${{ inputs.north }}'
          [ -n "$west" ] || west='150.95'
          [ -n "$south" ] || south='-33.62'
          [ -n "$east" ] || east='151.65'
          [ -n "$north" ] || north='-33.10'
          python3 - "$west" "$south" "$east" "$north" <<'PY'
          import sys
          w,s,e,n=map(float,sys.argv[1:])
          if not (w<e and s<n): raise SystemExit('Invalid AOI bounds')
          if w<140.0 or e>160.0 or s<-39.0 or n>-27.0: raise SystemExit('AOI outside expected NSW envelope')
          print(f'Local LiDAR cache AOI: {w},{s},{e},{n}')
          PY
          echo "AOI_XMIN=$west" >> "$GITHUB_ENV"
          echo "AOI_YMIN=$south" >> "$GITHUB_ENV"
          echo "AOI_XMAX=$east" >> "$GITHUB_ENV"
          echo "AOI_YMAX=$north" >> "$GITHUB_ENV"

      - name: Resolve manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          url='${{ inputs.manifest_url }}'
          if [ -n "$url" ]; then
            curl --fail --location --retry 5 "$url" -o "$RUNNER_TEMP/lidar-downloads.txt"
            echo "path=$RUNNER_TEMP/lidar-downloads.txt" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Ev '^[[:space:]]*(#|$)' data/lidar-downloads.txt | grep -qE '^(dem|laz)\|https?://'; then
            echo 'Using curated repository manifest. Note: the local AOI crop still controls published terrain coverage.'
            echo 'path=data/lidar-downloads.txt' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'No curated URLs found. Attempting current ELVIS discovery for requested AOI.'
          chmod +x scripts/elvis-frontend-probe.sh scripts/elvis-backend-probe.sh scripts/elvis-discover.py
          scripts/elvis-frontend-probe.sh || true
          scripts/elvis-backend-probe.sh || true
          scripts/elvis-discover.py \
            --bbox "$AOI_XMIN" "$AOI_YMIN" "$AOI_XMAX" "$AOI_YMAX" \
            --manifest "$RUNNER_TEMP/lidar-downloads.txt" \
            --json "$RUNNER_TEMP/elvis-aoi.json"
          echo "path=$RUNNER_TEMP/lidar-downloads.txt" >> "$GITHUB_OUTPUT"

      - name: Preview manifest
        run: |
          set -euo pipefail
          manifest='${{ steps.manifest.outputs.path }}'
          echo "Manifest entries: $(grep -Ev '^[[:space:]]*(#|$)' "$manifest" | wc -l)"
          sed -n '1,30p' "$manifest"

      - name: Download and build latest local terrain layers
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/lidar-sync.sh
          process='${{ inputs.process }}'; [ -n "$process" ] || process=true
          bash scripts/lidar-sync.sh '${{ steps.manifest.outputs.path }}' "$process"

      - name: Build dated local LiDAR hillshade epochs
        if: success() && (inputs.process == true || inputs.process == '')
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-lidar-epochs.sh scripts/select-lidar-epochs.py
          bash scripts/build-lidar-epochs.sh

      - name: Publish web permissions
        if: always()
        run: |
          set -euo pipefail
          root="$LIDAR_ROOT/web"
          docker run --rm -v "$root:/data" nginx:1.27-alpine sh -lc '
            chmod 755 /data
            for f in status.json imagery.json elevation-index.json change.json; do
              [ ! -e "/data/$f" ] || chmod 644 "/data/$f"
            done
            chmod -R a+rX /data/epochs /data/hillshade /data/slope /data/tri 2>/dev/null || true
          '

      - name: Show storage summary
        if: always()
        run: |
          echo '### Local high-resolution LiDAR cache' >> "$GITHUB_STEP_SUMMARY"
          echo "- AOI: $AOI_XMIN,$AOI_YMIN,$AOI_XMAX,$AOI_YMAX" >> "$GITHUB_STEP_SUMMARY"
          du -sh "$LIDAR_ROOT/raw" "$LIDAR_ROOT/derived" "$LIDAR_ROOT/web" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          df -h "$LIDAR_ROOT" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          test -f "$LIDAR_ROOT/web/status.json" && cat "$LIDAR_ROOT/web/status.json" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Refresh map service
        if: success()
        run: |
          if docker service inspect cchist_cchist >/dev/null 2>&1; then docker service update --force cchist_cchist >/dev/null; fi
