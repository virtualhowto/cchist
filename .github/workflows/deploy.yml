name: Deploy cchist

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cchist-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, ourimbah]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build and deploy
        run: |
          docker compose up -d --build --remove-orphans

      - name: Wait for container health
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker compose ps -q cchist)"
          if [ -z "$cid" ]; then
            echo "cchist container not found"
            docker compose ps
            exit 1
          fi

          for i in {1..30}; do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")"
            echo "Container status: $status"
            if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              docker compose logs --tail=200 cchist
              exit 1
            fi
            sleep 2
          done

          docker compose logs --tail=200 cchist
          exit 1

      - name: Verify site
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://cchist.virtualhowto.com || true)"
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Public health check failed"
          docker compose ps
          docker compose logs --tail=200 cchist
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "### cchist deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: ourimbah" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://cchist.virtualhowto.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
