name: Automate ELVIS 1m Order

on:
  push:
    branches: [main]
    paths:
      - scripts/elvis-browser.mjs
      - .github/workflows/elvis-order.yml
  workflow_dispatch:
    inputs:
      submit_order:
        description: Submit a real ELVIS order (requires ELVIS_EMAIL repository secret)
        required: true
        default: false
        type: boolean

concurrency:
  group: cchist-elvis-order
  cancel-in-progress: true

jobs:
  elvis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          set -euo pipefail
          docker info >/dev/null

      - name: Inspect or submit ELVIS order
        env:
          ELVIS_EMAIL: ${{ secrets.ELVIS_EMAIL }}
          ELVIS_INDUSTRY: ${{ vars.ELVIS_INDUSTRY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elvis"
          mode='inspect'
          if [ '${{ inputs.submit_order }}' = 'true' ]; then mode='order'; fi
          args=''
          if [ "$mode" = 'order' ]; then
            if [ -z "${ELVIS_EMAIL:-}" ]; then
              echo 'ELVIS_EMAIL repository secret is required to submit an order.'
              exit 2
            fi
            args='--order'
          fi

          docker run --rm \
            -e ELVIS_EMAIL \
            -e ELVIS_INDUSTRY="${ELVIS_INDUSTRY:-Other}" \
            -e ELVIS_OUT=/out \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/elvis:/out" \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc '
              set -euo pipefail
              mkdir -p /tmp/elvis-run
              cd /tmp/elvis-run
              npm init -y >/dev/null 2>&1
              npm install --no-audit --no-fund --silent playwright@1.55.0
              cp /work/scripts/elvis-browser.mjs ./elvis-browser.mjs
              node ./elvis-browser.mjs '"$args"'
            '

      - name: Summarise live ELVIS UI
        if: always()
        run: |
          echo '### ELVIS browser probe' >> "$GITHUB_STEP_SUMMARY"
          for f in "$RUNNER_TEMP"/elvis/*-text.txt; do
            [ -f "$f" ] || continue
            echo "#### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,100p' "$f" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload ELVIS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elvis-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/elvis/
          if-no-files-found: warn
          retention-days: 7
