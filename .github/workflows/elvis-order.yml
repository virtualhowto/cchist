name: Acquire NSW ELVIS 1m LiDAR

on:
  push:
    branches: [main]
    paths:
      - scripts/nsw-elvis-object-probe.py
      - scripts/nsw-elvis-s3-discover.py
      - scripts/elvis-browser.mjs
      - .github/workflows/elvis-order.yml
  workflow_dispatch:
    inputs:
      submit_order:
        description: Use the ELVIS browser order fallback if direct discovery finds nothing
        required: true
        default: false
        type: boolean

concurrency:
  group: cchist-elvis-order
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      entries: ${{ steps.manifest.outputs.entries }}
      dem_entries: ${{ steps.manifest.outputs.dem_entries }}
      laz_entries: ${{ steps.manifest.outputs.laz_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe known Gosford202008 metadata and sibling objects
        id: object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elvis"
          chmod +x scripts/nsw-elvis-object-probe.py
          set +e
          python3 scripts/nsw-elvis-object-probe.py \
            --manifest "$RUNNER_TEMP/elvis/object-manifest.txt" \
            --json "$RUNNER_TEMP/elvis/object-probe.json"
          rc=$?
          set -e
          echo "object_probe_rc=$rc"
          touch "$RUNNER_TEMP/elvis/object-manifest.txt"
          entries=$(grep -Ec '^(dem|laz)\|https?://' "$RUNNER_TEMP/elvis/object-manifest.txt" || true)
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "Known-object probe entries: $entries"
          sed -n '1,40p' "$RUNNER_TEMP/elvis/object-manifest.txt"

      - name: Try unsigned NSW ELVIS bucket discovery
        id: s3
        if: ${{ steps.object.outputs.entries == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/nsw-elvis-s3-discover.py
          set +e
          python3 scripts/nsw-elvis-s3-discover.py \
            --survey Gosford202008 \
            --manifest "$RUNNER_TEMP/elvis/s3-manifest.txt" \
            --json "$RUNNER_TEMP/elvis/s3-discovery.json"
          rc=$?
          set -e
          echo "s3_discovery_rc=$rc"
          touch "$RUNNER_TEMP/elvis/s3-manifest.txt"

      - name: Build acquisition manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/elvis/manifest.txt"
          for f in "$RUNNER_TEMP/elvis/object-manifest.txt" "$RUNNER_TEMP/elvis/s3-manifest.txt"; do
            [ -f "$f" ] || continue
            grep -E '^(dem|laz)\|https?://' "$f" >> "$RUNNER_TEMP/elvis/manifest.txt" || true
          done
          sort -u -o "$RUNNER_TEMP/elvis/manifest.txt" "$RUNNER_TEMP/elvis/manifest.txt"
          entries=$(grep -Ec '^(dem|laz)\|https?://' "$RUNNER_TEMP/elvis/manifest.txt" || true)
          dem_entries=$(grep -Ec '^dem\|https?://' "$RUNNER_TEMP/elvis/manifest.txt" || true)
          laz_entries=$(grep -Ec '^laz\|https?://' "$RUNNER_TEMP/elvis/manifest.txt" || true)
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "dem_entries=$dem_entries" >> "$GITHUB_OUTPUT"
          echo "laz_entries=$laz_entries" >> "$GITHUB_OUTPUT"
          echo "Acquisition manifest: total=$entries DEM=$dem_entries LAZ=$laz_entries"
          sed -n '1,60p' "$RUNNER_TEMP/elvis/manifest.txt"

      - name: ELVIS browser fallback probe
        if: ${{ steps.manifest.outputs.entries == '0' }}
        env:
          ELVIS_EMAIL: ${{ secrets.ELVIS_EMAIL }}
          ELVIS_INDUSTRY: ${{ vars.ELVIS_INDUSTRY }}
        run: |
          set -euo pipefail
          args=''
          if [ '${{ inputs.submit_order }}' = 'true' ]; then
            if [ -z "${ELVIS_EMAIL:-}" ]; then
              echo 'ELVIS_EMAIL repository secret is required for browser order fallback.'
            else
              args='--order'
            fi
          fi
          docker run --rm \
            -e ELVIS_EMAIL \
            -e ELVIS_INDUSTRY="${ELVIS_INDUSTRY:-Other}" \
            -e ELVIS_OUT=/out \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/elvis:/out" \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc '
              set -euo pipefail
              mkdir -p /tmp/elvis-run
              cd /tmp/elvis-run
              npm init -y >/dev/null 2>&1
              npm install --no-audit --no-fund --silent playwright@1.55.0
              cp /work/scripts/elvis-browser.mjs ./elvis-browser.mjs
              node ./elvis-browser.mjs '"$args"'
            '

      - name: Discovery summary
        if: always()
        run: |
          echo '### NSW ELVIS 1 m cloud discovery' >> "$GITHUB_STEP_SUMMARY"
          echo "- Survey: Gosford202008" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct objects: ${{ steps.manifest.outputs.entries }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DEM entries: ${{ steps.manifest.outputs.dem_entries }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- LAZ/LAS entries: ${{ steps.manifest.outputs.laz_entries }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery manifest and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elvis-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/elvis/
          if-no-files-found: warn
          retention-days: 7

  sync-1m:
    needs: discover
    if: ${{ needs.discover.outputs.entries != '0' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      LIDAR_ROOT: /mnt/usb/stack/cchist/lidar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify NUC and storage
        run: |
          set -euo pipefail
          test "$(hostname)" = "NUC8i7HNK"
          test -d /mnt/usb
          df -h /mnt/usb
      - name: Download discovery manifest
        uses: actions/download-artifact@v4
        with:
          name: elvis-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/elvis
      - name: Download and process 1 m NSW ELVIS data
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/elvis/manifest.txt"
          test -s "$manifest"
          chmod +x scripts/lidar-sync.sh
          scripts/lidar-sync.sh "$manifest" true
      - name: Refresh cchist
        if: success()
        run: |
          if docker service inspect cchist_cchist >/dev/null 2>&1; then docker service update --force cchist_cchist >/dev/null; fi

  home-probe-and-sync:
    needs: discover
    if: ${{ needs.discover.outputs.entries == '0' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    env:
      LIDAR_ROOT: /mnt/usb/stack/cchist/lidar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify NUC home-network path
        run: |
          set -euo pipefail
          test "$(hostname)" = "NUC8i7HNK"
          test -d /mnt/usb
          df -h /mnt/usb
          url='https://nsw-elvis.s3-ap-southeast-2.amazonaws.com/elevation/1m-dem/z56/Gosford202008/metadata/Gosford202008-LID1-AHD_3546308_56_0002_0002_1m.html'
          echo 'Testing known Gosford202008 metadata object from home connection:'
          curl -sSIL --connect-timeout 10 --max-time 30 "$url" | sed -n '1,12p' || true

      - name: Discover exact Gosford202008 objects from metadata
        id: home
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elvis-home"
          chmod +x scripts/nsw-elvis-object-probe.py
          set +e
          python3 scripts/nsw-elvis-object-probe.py \
            --manifest "$RUNNER_TEMP/elvis-home/manifest.txt" \
            --json "$RUNNER_TEMP/elvis-home/object-probe.json"
          rc=$?
          set -e
          touch "$RUNNER_TEMP/elvis-home/manifest.txt"
          entries=$(grep -Ec '^(dem|laz)\|https?://' "$RUNNER_TEMP/elvis-home/manifest.txt" || true)
          dem_entries=$(grep -Ec '^dem\|https?://' "$RUNNER_TEMP/elvis-home/manifest.txt" || true)
          laz_entries=$(grep -Ec '^laz\|https?://' "$RUNNER_TEMP/elvis-home/manifest.txt" || true)
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "Home probe rc=$rc entries=$entries DEM=$dem_entries LAZ=$laz_entries"
          sed -n '1,80p' "$RUNNER_TEMP/elvis-home/manifest.txt"

      - name: Download and process discovered 1 m data
        if: ${{ steps.home.outputs.entries != '0' }}
        run: |
          set -euo pipefail
          chmod +x scripts/lidar-sync.sh
          scripts/lidar-sync.sh "$RUNNER_TEMP/elvis-home/manifest.txt" true

      - name: Home discovery summary
        if: always()
        run: |
          echo '### NSW ELVIS 1 m home-network discovery' >> "$GITHUB_STEP_SUMMARY"
          echo "- Objects found: ${{ steps.home.outputs.entries }}" >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.home.outputs.entries }}' = '0' ]; then
            echo '- Known metadata/object access is still restricted or filenames are not directly derivable; ELVIS email-order API remains the fallback.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refresh cchist
        if: ${{ success() && steps.home.outputs.entries != '0' }}
        run: |
          if docker service inspect cchist_cchist >/dev/null 2>&1; then docker service update --force cchist_cchist >/dev/null; fi
