name: Deploy cchist to Swarm

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - nginx.conf
      - index.html
      - compare.js
      - compare-fix.js
      - terrain-change.js
      - imagery-filter.js
      - research-scope.js
      - branding.js
      - view-state.js
      - layout.js
      - docker-stack.yml
      - data/places.json
      - data/historic-maps.json
      - .dockerignore
      - .github/workflows/deploy-swarm.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cchist-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Swarm manager
        run: |
          set -euo pipefail
          test "$(hostname)" = "NUC8i7HNK"
          test "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "active"
          test "$(docker info --format '{{.Swarm.ControlAvailable}}')" = "true"

      - name: Prepare persistent LiDAR storage
        run: |
          set -euo pipefail
          root=/mnt/usb/stack/cchist/lidar/web
          mkdir -p "$root"
          chmod 755 /mnt/usb/stack/cchist /mnt/usb/stack/cchist/lidar "$root"
          docker run --rm -v "$root:/data" nginx:1.27-alpine sh -lc '
            chmod 755 /data
            [ ! -e /data/status.json ] || chmod 644 /data/status.json
            [ ! -e /data/imagery.json ] || chmod 644 /data/imagery.json
            [ ! -e /data/change.json ] || chmod 644 /data/change.json
          '
          for f in status.json imagery.json change.json; do
            if [ -e "$root/$f" ]; then
              echo "$f: $(stat -c '%a %U:%G %s bytes' "$root/$f")"
            fi
          done

      - name: Set image tag
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          set -euo pipefail
          docker build --pull -t "$IMAGE" .

      - name: Smoke test image
        run: |
          set -euo pipefail
          name="cchist-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" "$IMAGE"
          for i in $(seq 1 20); do
            if docker exec "$name" wget -qO- http://127.0.0.1/index.html >/dev/null; then
              docker exec "$name" wget -qO- http://127.0.0.1/data/places.json >/dev/null
              docker exec "$name" wget -qO- http://127.0.0.1/compare.js >/dev/null
              docker exec "$name" wget -qO- http://127.0.0.1/compare-fix.js >/dev/null
              docker exec "$name" wget -qO- http://127.0.0.1/terrain-change.js >/dev/null
              docker exec "$name" wget -qO- http://127.0.0.1/imagery-filter.js >/dev/null
              docker exec "$name" wget -qO- http://127.0.0.1/research-scope.js >/dev/null
              docker exec "$name" wget -qO- http://127.0.0.1/branding.js >/dev/null
              docker exec "$name" wget -qO- http://127.0.0.1/view-state.js >/dev/null
              docker exec "$name" wget -qO- http://127.0.0.1/layout.js >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs "$name" || true
          exit 1

      - name: Push image
        run: |
          set -euo pipefail
          docker push "$IMAGE"

      - name: Deploy stack
        run: |
          set -euo pipefail
          docker stack deploy --with-registry-auth --prune -c docker-stack.yml cchist

      - name: Wait for rollout
        run: |
          set -euo pipefail
          service=cchist_cchist
          for i in $(seq 1 30); do
            replicas=$(docker service ls --filter name="$service" --format '{{.Replicas}}')
            echo "Replicas: $replicas"
            if [ "$replicas" = "1/1" ]; then
              exit 0
            fi
            sleep 5
          done
          docker service ps "$service" --no-trunc
          exit 1

      - name: Verify mounted LiDAR assets
        run: |
          set -euo pipefail
          cid=$(docker ps --filter label=com.docker.swarm.service.name=cchist_cchist --format '{{.ID}}' | head -1)
          test -n "$cid"
          docker exec "$cid" sh -lc 'ls -l /usr/share/nginx/html/lidar/status.json /usr/share/nginx/html/lidar/imagery.json'
          docker exec "$cid" wget -qO- http://127.0.0.1/lidar/status.json >/dev/null
          docker exec "$cid" wget -qO- http://127.0.0.1/lidar/imagery.json >/dev/null
          if docker exec "$cid" test -f /usr/share/nginx/html/lidar/change.json; then
            docker exec "$cid" wget -qO- http://127.0.0.1/lidar/change.json >/dev/null
          fi

      - name: Verify HTTPS endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -ksS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 https://cchist.virtualhowto.com/ || true)
            echo "HTTP status: $code"
            case "$code" in
              200|301|302|303|307|308) exit 0 ;;
            esac
            sleep 3
          done
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "### cchist deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stack: cchist" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://cchist.virtualhowto.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- LiDAR web root: /mnt/usb/stack/cchist/lidar/web" >> "$GITHUB_STEP_SUMMARY"

      - name: Service diagnostics on failure
        if: failure()
        run: |
          docker stack services cchist || true
          docker service ps cchist_cchist --no-trunc || true
          docker service logs cchist_cchist --tail 100 || true
