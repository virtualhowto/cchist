name: Deploy cchist to Swarm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cchist-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, ourimbah]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Swarm manager
        run: |
          set -euo pipefail
          docker info --format '{{.Swarm.LocalNodeState}} {{.Swarm.ControlAvailable}}'
          test "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "active"
          test "$(docker info --format '{{.Swarm.ControlAvailable}}')" = "true"

      - name: Build image
        run: |
          set -euo pipefail
          docker build --pull -t cchist:${GITHUB_SHA} -t cchist:latest .

      - name: Deploy stack
        run: |
          set -euo pipefail
          docker stack deploy --prune -c docker-stack.yml cchist

      - name: Wait for service
        run: |
          set -euo pipefail
          service=cchist_cchist
          for i in $(seq 1 30); do
            replicas=$(docker service ls --filter name="$service" --format '{{.Replicas}}')
            echo "Replicas: $replicas"
            if [ "$replicas" = "1/1" ]; then
              exit 0
            fi
            sleep 4
          done
          docker service ps --no-trunc "$service"
          exit 1

      - name: Verify HTTPS endpoint
        run: |
          set -euo pipefail
          # Behind Authentik, an unauthenticated request may return a redirect rather than 200.
          code=$(curl -ksS -o /dev/null -w '%{http_code}' https://cchist.virtualhowto.com/)
          echo "HTTP status: $code"
          case "$code" in
            200|302|303|307|308) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Service diagnostics on failure
        if: failure()
        run: |
          docker stack services cchist || true
          docker service ps --no-trunc cchist_cchist || true
          docker service logs --tail 100 cchist_cchist || true
