server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy 'geolocation=(), microphone=(), camera=()' always;
        sub_filter_once off;
        sub_filter 'Central Coast History Map' 'History Research Map';
        sub_filter "setView([-33.39,151.39],10)" "setView([-32.7,147.0],6)";
        sub_filter '</body>' '<script src="/nsw-config.js"></script><script src="/compare-v3.js"></script><script src="/statewide-terrain.js"></script><script src="/terrain-change.js"></script><script src="/imagery-filter.js"></script><script src="/research-scope-nsw.js"></script><script src="/elevation-index.js"></script><script src="/branding.js"></script><script src="/view-state-nsw.js"></script><script src="/layout.js"></script></body>';
        try_files /index.html =404;
    }

    location = /nsw-config.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /nsw-config.js =404; }
    location = /compare-v3.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /compare-v3.js =404; }
    location = /statewide-terrain.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /statewide-terrain.js =404; }
    location = /terrain-change.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /terrain-change.js =404; }
    location = /imagery-filter.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /imagery-filter.js =404; }
    location = /research-scope-nsw.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /research-scope-nsw.js =404; }
    location = /elevation-index.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /elevation-index.js =404; }
    location = /branding.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /branding.js =404; }
    location = /view-state-nsw.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /view-state-nsw.js =404; }
    location = /layout.js { add_header Cache-Control 'public, max-age=300'; add_header X-Content-Type-Options nosniff always; try_files /layout.js =404; }

    location /data/ {
        add_header Cache-Control 'public, max-age=300';
        try_files $uri =404;
    }

    location /lidar/ {
        access_log off;
        add_header Cache-Control 'public, max-age=86400, stale-while-revalidate=604800';
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy 'geolocation=(), microphone=(), camera=()' always;
        sub_filter_once off;
        sub_filter 'Central Coast History Map' 'History Research Map';
        sub_filter "setView([-33.39,151.39],10)" "setView([-32.7,147.0],6)";
        sub_filter '</body>' '<script src="/nsw-config.js"></script><script src="/compare-v3.js"></script><script src="/statewide-terrain.js"></script><script src="/terrain-change.js"></script><script src="/imagery-filter.js"></script><script src="/research-scope-nsw.js"></script><script src="/elevation-index.js"></script><script src="/branding.js"></script><script src="/view-state-nsw.js"></script><script src="/layout.js"></script></body>';
        try_files $uri /index.html;
    }
}
